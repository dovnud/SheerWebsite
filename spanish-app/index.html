<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hola – Spanish for Beginners</title>
<style>
  :root { --bg:#fff8ef; --card:#fff; --ink:#2b2b2b; --muted:#777; --accent:#e4572e; --ok:#2e9e5b; --bad:#d6336c; --line:#eadfce; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1a18; --card:#262421; --ink:#f2ece2; --muted:#a39a8c; --line:#3a3631; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:17px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:1.4rem; margin:8px 0 2px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  nav { display:flex; gap:8px; margin-bottom:16px; }
  nav button { flex:1; }
  button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.active, button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; text-align:center; }
  .big { font-size:2rem; font-weight:700; margin:12px 0; }
  .hint { color:var(--muted); font-size:.9rem; }
  .row { display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .choices { display:grid; gap:8px; margin-top:16px; }
  .choices button.right { background:var(--ok); color:#fff; border-color:var(--ok); }
  .choices button.wrong { background:var(--bad); color:#fff; border-color:var(--bad); }
  select { font:inherit; padding:8px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); width:100%; margin-bottom:12px; }
  .bar { height:8px; background:var(--line); border-radius:99px; overflow:hidden; margin:12px 0; }
  .bar > i { display:block; height:100%; background:var(--accent); width:0; transition:width .3s; }
  .say { background:none; border:none; font-size:1.4rem; padding:4px 8px; }
</style>
</head>
<body>
<main>
  <h1>¡Hola! 👋 Learn Spanish</h1>
  <p class="sub">Beginner basics: learn, practice, quiz. <span id="stats"></span></p>
  <nav>
    <button data-mode="learn" class="active">Learn</button>
    <button data-mode="quiz">Quiz</button>
  </nav>
  <select id="topic"></select>
  <div id="view"></div>
</main>

<script>
// ---- Content: easy to extend. [spanish, english] ----
const TOPICS = {
  "Greetings": [
    ["Hola","Hello"],["Buenos días","Good morning"],["Buenas tardes","Good afternoon"],
    ["Buenas noches","Good evening / night"],["Adiós","Goodbye"],["Hasta luego","See you later"],
    ["Por favor","Please"],["Gracias","Thank you"],["De nada","You're welcome"],
    ["Lo siento","I'm sorry"],["Perdón","Excuse me"],["¿Cómo estás?","How are you?"],
    ["Muy bien","Very well"],["Mucho gusto","Nice to meet you"],["Me llamo…","My name is…"]
  ],
  "Numbers 1–10": [
    ["uno","one"],["dos","two"],["tres","three"],["cuatro","four"],["cinco","five"],
    ["seis","six"],["siete","seven"],["ocho","eight"],["nueve","nine"],["diez","ten"]
  ],
  "Colors": [
    ["rojo","red"],["azul","blue"],["verde","green"],["amarillo","yellow"],["negro","black"],
    ["blanco","white"],["naranja","orange"],["morado","purple"],["rosa","pink"],["marrón","brown"]
  ],
  "Food & Drink": [
    ["el agua","water"],["el pan","bread"],["la leche","milk"],["el café","coffee"],
    ["la manzana","apple"],["el queso","cheese"],["el pollo","chicken"],["el arroz","rice"],
    ["la sopa","soup"],["la cuenta, por favor","the check, please"]
  ],
  "Family": [
    ["la madre","mother"],["el padre","father"],["el hermano","brother"],["la hermana","sister"],
    ["el abuelo","grandfather"],["la abuela","grandmother"],["el hijo","son"],["la hija","daughter"],
    ["el amigo","friend (male)"],["la amiga","friend (female)"]
  ],
  "Handy Questions": [
    ["¿Dónde está el baño?","Where is the bathroom?"],["¿Cuánto cuesta?","How much does it cost?"],
    ["¿Hablas inglés?","Do you speak English?"],["No entiendo","I don't understand"],
    ["¿Puedes repetir?","Can you repeat?"],["Más despacio, por favor","Slower, please"],
    ["¿Qué es esto?","What is this?"],["Necesito ayuda","I need help"]
  ]
};

// ---- State (progress saved in localStorage when available) ----
let mode = "learn", topic = Object.keys(TOPICS)[0];
let store = {};
try { store = JSON.parse(localStorage.getItem("hola") || "{}"); } catch (e) {}
store.best = store.best || {}; store.seen = store.seen || 0;
const save = () => { try { localStorage.setItem("hola", JSON.stringify(store)); } catch (e) {} };

const $ = s => document.querySelector(s);
const view = $("#view");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

function speak(text) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text.replace("…",""));
  u.lang = "es-ES"; u.rate = 0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

function stats() {
  const b = Object.keys(store.best).length;
  $("#stats").textContent = `Cards seen: ${store.seen} · Quizzes done: ${b}/${Object.keys(TOPICS).length}`;
}

// ---- Learn: flashcards ----
function learn() {
  const deck = shuffle(TOPICS[topic]); let i = 0, flipped = false;
  const draw = () => {
    const [es, en] = deck[i];
    view.innerHTML = `
      <div class="bar"><i style="width:${(i/deck.length)*100}%"></i></div>
      <div class="card">
        <div class="hint">${i+1} / ${deck.length} · tap card to flip</div>
        <div class="big" id="face" style="cursor:pointer">${flipped ? en : es}</div>
        <button class="say" title="Hear it" id="say">🔊</button>
        <div class="row">
          <button id="prev" ${i===0?"disabled":""}>← Back</button>
          <button class="primary" id="next">${i===deck.length-1?"Restart":"Next →"}</button>
        </div>
      </div>`;
    $("#face").onclick = () => { flipped = !flipped; draw(); };
    $("#say").onclick = () => speak(es);
    $("#prev").onclick = () => { i--; flipped = false; draw(); };
    $("#next").onclick = () => {
      store.seen++; save(); stats();
      if (i === deck.length-1) return learn();
      i++; flipped = false; draw();
    };
    if (!flipped) speak(es);
  };
  draw();
}

// ---- Quiz: multiple choice, Spanish -> English ----
function quiz() {
  const words = TOPICS[topic], qs = shuffle(words).slice(0, 8);
  let i = 0, score = 0;
  const ask = () => {
    if (i >= qs.length) return done();
    const [es, en] = qs[i];
    const opts = shuffle([en, ...shuffle(words.filter(w => w[1] !== en)).slice(0,3).map(w => w[1])]);
    view.innerHTML = `
      <div class="bar"><i style="width:${(i/qs.length)*100}%"></i></div>
      <div class="card">
        <div class="hint">What does this mean?</div>
        <div class="big">${es} <button class="say" id="say">🔊</button></div>
        <div class="choices">${opts.map(o => `<button>${o}</button>`).join("")}</div>
      </div>`;
    $("#say").onclick = () => speak(es);
    view.querySelectorAll(".choices button").forEach(b => b.onclick = () => {
      const ok = b.textContent === en;
      if (ok) score++;
      view.querySelectorAll(".choices button").forEach(x => {
        x.disabled = true;
        if (x.textContent === en) x.classList.add("right");
      });
      if (!ok) b.classList.add("wrong");
      setTimeout(() => { i++; ask(); }, 900);
    });
  };
  const done = () => {
    store.best[topic] = Math.max(store.best[topic] || 0, score); save(); stats();
    view.innerHTML = `
      <div class="card">
        <div class="big">${score} / ${qs.length}</div>
        <p>${score === qs.length ? "¡Perfecto! 🎉" : score >= qs.length/2 ? "¡Muy bien! Keep going." : "Keep practicing in Learn mode, then try again."}</p>
        <div class="hint">Best on this topic: ${store.best[topic]} / ${qs.length}</div>
        <div class="row"><button class="primary" id="again">Try again</button><button id="tolearn">Review cards</button></div>
      </div>`;
    $("#again").onclick = quiz;
    $("#tolearn").onclick = () => setMode("learn");
  };
  ask();
}

function render() { mode === "learn" ? learn() : quiz(); }
function setMode(m) {
  mode = m;
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("active", b.dataset.mode === m));
  render();
}

// ---- Init ----
const sel = $("#topic");
sel.innerHTML = Object.keys(TOPICS).map(t => `<option>${t}</option>`).join("");
sel.onchange = () => { topic = sel.value; render(); };
document.querySelectorAll("nav button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
stats(); render();
</script>
</body>
</html>
